<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>トーナメントブラケット</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #172033; background: #f4f7fb; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(92vw, 760px); padding: 2rem; border: 1px solid #dbe3ef; border-radius: 18px; background: #fff; box-shadow: 0 12px 32px rgb(31 52 86 / 10%); }
      h1 { margin: 0 0 .5rem; font-size: clamp(1.6rem, 4vw, 2.4rem); }
      p { margin: 0 0 1.5rem; color: #5e6b82; }
      form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
      input, button { padding: .7rem .8rem; border: 1px solid #dbe3ef; border-radius: 8px; font: inherit; }
      input { flex: 1; }
      button { cursor: pointer; color: #fff; border-color: #6c63ff; background: #6c63ff; }
      #new-tournament { margin-bottom: 1rem; background: #53657d; border-color: #53657d; }
      .team { width: 100%; color: #172033; text-align: left; background: #f8faff; }
      .delete { margin-top: .25rem; padding: .25rem .45rem; color: #b42318; border-color: #f2c5c1; background: #fff; font-size: .75rem; }
      .bracket { display: grid; grid-template-columns: repeat(var(--rounds, 1), minmax(180px, 1fr)); gap: 1rem; align-items: start; }
      h2 { margin: 0 0 .75rem; font-size: .85rem; color: #68758a; letter-spacing: .08em; }
      .match { display: grid; gap: .4rem; margin-bottom: 1rem; }
      .team { padding: .7rem .8rem; border: 1px solid #dbe3ef; border-radius: 8px; background: #f8faff; }
      .winner { border-color: #6c63ff; background: #f0efff; font-weight: 700; }
      .champion { border-color: #f0b429; background: #fff8e5; }
      footer { margin-top: 1rem; font-size: .8rem; color: #7b8799; }
      @media (max-width: 600px) { main { padding: 1.25rem; } .bracket { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>春季トーナメント</h1>
      <p>参加者を手動登録してトーナメント表を作成します。</p>
      <button id="new-tournament" type="button">新しいトーナメント</button>
      <form id="participant-form"><input id="participant-name" placeholder="参加者名を入力" required /><button type="submit">登録</button></form>
      <p id="status">参加者を登録してください</p>
      <section id="bracket" class="bracket" aria-label="トーナメント表"></section>
      <footer>HTML と CSS だけで構成されています。</footer>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
