<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>利用者 - トーナメント表</title>
    <style>
      :root { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; color: #172033; background: #eef3f8; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(94vw, 1180px); padding: 2.5rem; border: 2px solid #343e7a; border-radius: 16px; background: #11182b; box-shadow: 0 0 24px rgb(87 70 255 / 30%); }
      main::before { content: "●  ●  ●   tournament-bracket / main"; display: block; margin: -2rem -2rem 1.75rem; padding: .75rem 1rem; border-bottom: 1px solid #cbd7e5; color: #718096; background: #f7f9fc; font-size: .75rem; }
      h1 { margin: 0 0 .5rem; color: #263b58; font-size: clamp(1.4rem, 4vw, 2.2rem); }
      h1::before { content: ">_ "; color: #16a085; }
      p { margin: 0 0 1.5rem; color: #5e6b82; }
      form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
      input, button { padding: .7rem .8rem; border: 1px solid #dbe3ef; border-radius: 8px; font: inherit; }
      input { flex: 1; }
      button { cursor: pointer; color: #fff; border-color: #147d68; background: #147d68; }
      #new-tournament { margin-bottom: 1rem; color: #53657d; border-color: #cbd7e5; background: #f7f9fc; }
      .viewer-mode #new-tournament, .viewer-mode #reset-tournament, .viewer-mode #participant-form { display: none; }
      .team { width: 100%; color: #172033; text-align: left; background: #f8faff; }
      .delete { margin-top: .25rem; padding: .25rem .45rem; color: #b42318; border-color: #f2c5c1; background: #fff; font-size: .75rem; }
      .bracket { display: grid; grid-template-columns: repeat(var(--rounds, 1), minmax(240px, 1fr)); gap: 2rem; align-items: start; }
      h2 { margin: 0 0 .75rem; font-size: .8rem; color: #147d68; letter-spacing: .08em; }
      h2::before { content: "// "; color: #9aaabd; }
      .match { display: grid; gap: .4rem; margin-bottom: 1rem; }
      .round { position: relative; }
      .round:not(:last-child) .match::after { content: ""; position: absolute; top: 50%; right: -1rem; width: 1rem; border-top: 2px solid #69f7d0; opacity: .75; }
      .round:not(:first-child) .match::before { content: ""; position: absolute; top: 50%; left: -1rem; width: 1rem; border-top: 2px solid #69f7d0; opacity: .75; }
      .team { min-height: 2.8rem; padding: .9rem 1rem; border: 1px solid #3f4d8e; border-radius: 8px; background: #1a2440; color: #eaf0ff; font-size: 1rem; }
      .winner { border-color: #6c63ff; background: #f0efff; font-weight: 700; }
      .champion { border-color: #f0b429; background: #fff8e5; }
      footer { margin-top: 1rem; font-size: .75rem; color: #7b8799; }
      @media (max-width: 600px) { main { padding: 1.25rem; } .bracket { grid-template-columns: 1fr; } }
      .round:not(:last-child) .match::after, .round:not(:first-child) .match::before { display: none; }
      .match { position: relative; margin: 0 0 1.25rem; padding: .55rem; border: 1px solid #3f4d8e; border-radius: 10px; background: #0d1324; }
      .match::before { content: "VS"; position: absolute; z-index: 1; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: .15rem .35rem; border: 1px solid #ffcf4a; border-radius: 999px; color: #ffcf4a; background: #11182b; font-size: .65rem; font-weight: 700; }
      .round .match::before { content: "VS"; display: block; border: 1px solid #ffcf4a; }
      .round:not(:first-child) .match::before { content: "VS"; display: block; top: 50%; left: 50%; width: auto; border: 1px solid #ffcf4a; }
      .match { width: 100%; min-width: 0; box-sizing: border-box; }
      .team { width: 100%; min-width: 0; box-sizing: border-box; }
    </style>
  </head>
  <body class="viewer-mode">
    <main>
      <h1>U-16プログラミングコンテスト静岡大会</h1>
      <p>参加者を手動登録してトーナメント表を作成します。</p>
      <button id="new-tournament" type="button">新しいトーナメント</button>
      <button id="reset-tournament" type="button">現在の大会をリセット</button>
      <form id="participant-form"><input id="participant-name" placeholder="参加者名を入力" required /><button type="submit">登録</button></form>
      <p id="status">参加者を登録してください</p>
      <section id="bracket" class="bracket" aria-label="トーナメント表"></section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
