<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理者 - トーナメント表</title>
    <style>
      :root { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; color: #172033; background: #eef3f8; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(92vw, 820px); padding: 2rem; border: 1px solid #cbd7e5; border-radius: 12px; background: #fff; box-shadow: 0 16px 36px rgb(31 52 86 / 12%); }
      main::before { content: "●  ●  ●   tournament-bracket / main"; display: block; margin: -2rem -2rem 1.75rem; padding: .75rem 1rem; border-bottom: 1px solid #cbd7e5; color: #718096; background: #f7f9fc; font-size: .75rem; }
      h1 { margin: 0 0 .5rem; color: #263b58; font-size: clamp(1.4rem, 4vw, 2.2rem); }
      h1::before { content: ">_ "; color: #16a085; }
      p { margin: 0 0 1.5rem; color: #5e6b82; }
      form { display: flex; gap: .5rem; margin-bottom: 1.5rem; }
      input, button { padding: .7rem .8rem; border: 1px solid #dbe3ef; border-radius: 8px; font: inherit; }
      input { flex: 1; }
      button { cursor: pointer; color: #fff; border-color: #147d68; background: #147d68; }
      #new-tournament { margin-bottom: 1rem; color: #53657d; border-color: #cbd7e5; background: #f7f9fc; }
      #participant-list { margin: 1rem 0; padding: 1rem; border: 1px solid #3f4d8e; border-radius: 8px; background: #0d1324; }
      #participant-list h2 { margin-top: 0; }
      #participant-list ul { margin: 0; padding-left: 1.5rem; color: #eaf0ff; }
      #new-tournament, #reset-tournament, .delete, .team { display: none; }
      #participant-form, #participant-form .team { display: flex; }
      .team { width: 100%; color: #172033; text-align: left; background: #f8faff; }
      .delete { margin-top: .25rem; padding: .25rem .45rem; color: #b42318; border-color: #f2c5c1; background: #fff; font-size: .75rem; }
      .bracket { display: grid; grid-template-columns: repeat(var(--rounds, 1), minmax(180px, 1fr)); gap: 1rem; align-items: start; }
      h2 { margin: 0 0 .75rem; font-size: .8rem; color: #147d68; letter-spacing: .08em; }
      h2::before { content: "// "; color: #9aaabd; }
      .match { display: grid; gap: .4rem; margin-bottom: 1rem; }
      .team { padding: .7rem .8rem; border: 1px solid #cbd7e5; border-radius: 6px; background: #f7f9fc; }
      .winner { border-color: #6c63ff; background: #f0efff; font-weight: 700; }
      .champion { border-color: #f0b429; background: #fff8e5; }
      footer { margin-top: 1rem; font-size: .75rem; color: #7b8799; }
      @media (max-width: 600px) { main { padding: 1.25rem; } .bracket { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>U-16プログラミングコンテスト静岡大会</h1>
      <p>参加者を手動登録してトーナメント表を作成します。</p>
      <button id="new-tournament" type="button">新しいトーナメント</button>
      <button id="reset-tournament" type="button">現在の大会をリセット</button>
      <form id="participant-form"><input id="participant-name" placeholder="参加者名を入力" required /><button type="submit">登録</button></form>
      <section id="participant-list" aria-label="登録済み参加者"><h2>登録済み参加者</h2><ul></ul></section>
      <p id="status">参加者を登録してください</p>
      <section id="bracket" class="bracket" aria-label="トーナメント表"></section>
    </main>
    <script src="./app.js" defer></script>
  </body>
</html>
