<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>トーナメントブラケット</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #172033; background: #f4f7fb; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(92vw, 760px); padding: 2rem; border: 1px solid #dbe3ef; border-radius: 18px; background: #fff; box-shadow: 0 12px 32px rgb(31 52 86 / 10%); }
      h1 { margin: 0 0 .5rem; font-size: clamp(1.6rem, 4vw, 2.4rem); }
      p { margin: 0 0 1.5rem; color: #5e6b82; }
      .bracket { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; align-items: center; }
      h2 { margin: 0 0 .75rem; font-size: .85rem; color: #68758a; letter-spacing: .08em; }
      .match { display: grid; gap: .4rem; margin-bottom: 1rem; }
      .team { padding: .7rem .8rem; border: 1px solid #dbe3ef; border-radius: 8px; background: #f8faff; }
      .winner { border-color: #6c63ff; background: #f0efff; font-weight: 700; }
      .champion { border-color: #f0b429; background: #fff8e5; }
      footer { margin-top: 1rem; font-size: .8rem; color: #7b8799; }
      @media (max-width: 600px) { main { padding: 1.25rem; } .bracket { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>春季トーナメント</h1>
      <p>Google Apps Script を使わずに表示できる静的なサンプルです。</p>
      <section class="bracket" aria-label="トーナメント表">
        <div><h2>準々決勝</h2><div class="match"><div class="team winner">Blue Falcons</div><div class="team">Red Bears</div></div><div class="match"><div class="team">Green Owls</div><div class="team winner">Golden Foxes</div></div></div>
        <div><h2>準決勝</h2><div class="match"><div class="team winner">Blue Falcons</div><div class="team">Golden Foxes</div></div></div>
        <div><h2>決勝</h2><div class="match"><div class="team champion">Blue Falcons 🏆</div><div class="team">—</div></div></div>
      </section>
      <footer>HTML と CSS だけで構成されています。</footer>
    </main>
  </body>
</html>
